<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GhostLock Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1, h2 { color: #333; }
    input, button { margin: 5px 5px 5px 0; padding: 8px; font-size: 14px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 10px 0; background: #fff; }
    .bet-buttons button { margin-right: 5px; }
    #bets { margin-top: 20px; }
    #ai-picks { margin-top: 10px; }
  </style>
</head>
<body>

<h1>GhostLock Dashboard</h1>

<h2>Bankroll</h2>
<input id="bankroll" type="number" value="1000" />
<p>Unit Size: $<span id="unitSize">10</span></p>
<p>Profit/Loss: $<span id="profit">0</span></p>
<p>Win Rate: <span id="winrate">0</span>%</p>

<h2>Add Bet</h2>
<input id="game" placeholder="Game" />
<input id="pick" placeholder="Pick" />
<input id="confidence" type="number" min="1" max="5" value="3" />
<button onclick="addBet()">Add Bet</button>

<h2>Bet Tracker</h2>
<div id="bets"></div>

<h2>AI Picks</h2>
<button onclick="generateAIPicks()">Generate AI Picks</button>
<div id="ai-picks"></div>

<script>
let bets = [];
let startingBankroll = 1000;

// Unit calculation
function getUnitSize() {
  return Number(document.getElementById("bankroll").value) * 0.01;
}

// Confidence to units
function getUnits(conf) {
  conf = Number(conf);
  if (conf === 5) return 5;
  if (conf === 4) return 3.5;
  if (conf === 3) return 2;
  if (conf === 2) return 1;
  return 0.5;
}

// Add a bet
function addBet() {
  const game = document.getElementById("game").value.trim();
  const pick = document.getElementById("pick").value.trim();
  const confidence = document.getElementById("confidence").value;

  if (!game || !pick) return alert("Enter game and pick.");

  const units = getUnits(confidence);
  const amount = units * getUnitSize();

  bets.unshift({
    id: Date.now(),
    game,
    pick,
    confidence,
    units,
    amount,
    result: "pending"
  });

  render();
  document.getElementById("game").value = "";
  document.getElementById("pick").value = "";
}

// Settle bet
function settle(id, result) {
  const bankrollInput = document.getElementById("bankroll");
  let bankroll = Number(bankrollInput.value);

  bets = bets.map(b => {
    if (b.id === id && b.result === "pending") {
      bankroll += result === "win" ? b.amount : -b.amount;
      return { ...b, result };
    }
    return b;
  });

  bankrollInput.value = bankroll;
  render();
}

// Render bets
function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  let wins = 0;
  let losses = 0;

  bets.forEach(b => {
    if (b.result === "win") wins++;
    if (b.result === "loss") losses++;

    container.innerHTML += `
      <div class="card">
        <strong>${b.game}</strong><br/>
        ${b.pick}<br/>
        ${b.confidence}⭐ | ${b.units}u | $${b.amount.toFixed(2)}<br/>
        Status: ${b.result}<br/>
        <div class="bet-buttons">
          ${
            b.result === "pending"
              ? `<button onclick="settle(${b.id}, 'win')">Win</button>
                 <button onclick="settle(${b.id}, 'loss')">Loss</button>`
              : ""
          }
        </div>
      </div>
    `;
  });

  const bankroll = Number(document.getElementById("bankroll").value);
  const profit = bankroll - startingBankroll;
  const total = wins + losses;
  const winrate = total ? ((wins / total) * 100).toFixed(1) : 0;

  document.getElementById("unitSize").innerText = getUnitSize().toFixed(2);
  document.getElementById("profit").innerText = profit.toFixed(2);
  document.getElementById("winrate").innerText = winrate;
}

// AI pick generator (mock)
function generateAIPicks() {
  const picks = [
    "Team A ML",
    "Team B -1.5",
    "Over 7.5 Total",
    "Team C +1.5",
    "Team D ML"
  ];

  const container = document.getElementById("ai-picks");
  container.innerHTML = picks.map(p => `<div>${p}</div>`).join("");
}

// Save/load from localStorage
window.addEventListener("load", () => {
  const saved = localStorage.getItem("bets");
  if (saved) bets = JSON.parse(saved);

  const savedBankroll = localStorage.getItem("bankroll");
  if (savedBankroll) document.getElementById("bankroll").value = savedBankroll;

  render();
});

window.addEventListener("beforeunload", () => {
  localStorage.setItem("bets", JSON.stringify(bets));
  localStorage.setItem("bankroll", document.getElementById("bankroll").value);
});
</script>

</body>
</html>
