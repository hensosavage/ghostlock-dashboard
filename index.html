<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edgeline AI Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; padding:20px; }
  h1,h2 { color:#f8fafc; }
  button,input { padding:8px; margin:5px; border-radius:6px; border:none; }
  button { background:#22c55e; color:#000; cursor:pointer; font-weight:bold; }
  .card { background:#1e293b; padding:12px; margin:10px 0; border-radius:10px; }
  .win { border-left:5px solid #22c55e; }
  .loss { border-left:5px solid #ef4444; }
  .pending { border-left:5px solid #64748b; }
</style>
</head>
<body>

<h1>Edgeline AI</h1>

<h2>Bankroll</h2>
<input id="bankroll" type="number" value="1000" />
<p>Unit: $<span id="unit">10</span></p>
<p>P/L: $<span id="profit">0</span></p>
<p>Winrate: <span id="winrate">0</span>%</p>

<h2>Live Odds</h2>
<button onclick="fetchOdds()">Load Today's Odds</button>
<div id="games"></div>

<h2>AI Picks</h2>
<button onclick="analyzeGames()">Analyze Games</button>
<div id="ai"></div>

<h2>Bet Tracker</h2>
<div id="bets"></div>

<script>
let bets = [];
let currentGames = [];
let starting = 1000;

function unit(){ return Number(bankroll.value)*0.01 }

async function fetchOdds(){
  const res = await fetch("https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=fc71ff1db9b92e17fd4298c2334cef40&regions=us&markets=h2h");
  const data = await res.json();

  currentGames = data.map(g=>{
    const outcomes = g.bookmakers?.[0]?.markets?.[0]?.outcomes || [];
    return {
      game: `${g.home_team} vs ${g.away_team}`,
      home: g.home_team,
      away: g.away_team,
      homeOdds: outcomes.find(o=>o.name===g.home_team)?.price || "N/A",
      awayOdds: outcomes.find(o=>o.name===g.away_team)?.price || "N/A"
    }
  });

  renderGames();
}

function renderGames(){
  games.innerHTML = currentGames.map(g=>`
    <div class="card">
      <strong>${g.game}</strong><br/>
      ${g.home}: ${g.homeOdds} | ${g.away}: ${g.awayOdds}
    </div>
  `).join("");
}

async function analyzeGames(){
  const response = await fetch("/api/generate-picks", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(currentGames)
  });

  const data = await response.json();
  renderAIPicks(data);
}

function renderAIPicks(picks){
  ai.innerHTML = picks.map(p=>`
    <div class="card">
      <strong>${p.game}</strong><br/>
      ${p.pick}<br/>
      ${"⭐".repeat(p.confidence)} | ${p.units}u<br/>
      <em>${p.reason}</em><br/>
      <button onclick="addBet('${p.game}','${p.pick}',${p.confidence},${p.units})">Add</button>
    </div>
  `).join("");
}

function addBet(game,pick,conf,units){
  const amt = units*unit();
  bets.unshift({id:Date.now(),game,pick,conf,units,amt,res:"pending"});
  render();
}

function settle(id,res){
  let br = Number(bankroll.value);
  bets = bets.map(b=>{
    if(b.id===id && b.res==="pending"){
      br += res==="win"?b.amt:-b.amt;
      return {...b,res};
    }
    return b;
  });
  bankroll.value = br;
  render();
}

function render(){
  let w=0,l=0;
  betsEl = bets.map(b=>{
    if(b.res==="win") w++;
    if(b.res==="loss") l++;
    return `<div class="card ${b.res}">
      <strong>${b.game}</strong><br/>
      ${b.pick}<br/>
      ${b.units}u ($${b.amt.toFixed(2)})<br/>
      ${b.res}<br/>
      ${b.res==="pending"?`<button onclick="settle(${b.id},'win')">Win</button>
      <button onclick="settle(${b.id},'loss')">Loss</button>`:""}
    </div>`;
  }).join("");

  bets.innerHTML = betsEl;

  const total = w+l;
  winrate.innerText = total?((w/total)*100).toFixed(1):0;
  profit.innerText = (bankroll.value-starting).toFixed(2);
  unit.innerText = unit().toFixed(2);
}

</script>

</body>
</html>
