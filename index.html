<!DOCTYPE html>
<html>
<head>
  <title>GhostLock Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>

<h1>GhostLock Dashboard</h1>

<h2>Bankroll</h2>
<input id="bankroll" type="number" value="1000" />
<p>Unit Size: $<span id="unitSize">10</span></p>
<p>Profit/Loss: $<span id="profit">0</span></p>
<p>Win Rate: <span id="winrate">0</span>%</p>

<h2>Add Bet</h2>
<input id="game" placeholder="Game" />
<input id="pick" placeholder="Pick" />
<input id="confidence" type="number" min="1" max="5" value="3" />
<button onclick="addBet()">Add Bet</button>

<h2>Bet Tracker</h2>
<div id="bets"></div>

<script>
let bets = [];
let startingBankroll = 1000;

function getUnitSize() {
  return document.getElementById("bankroll").value * 0.01;
}

function getUnits(conf) {
  if (conf == 5) return 5;
  if (conf == 4) return 3.5;
  if (conf == 3) return 2;
  if (conf == 2) return 1;
  return 0.5;
}

function addBet() {
  const game = document.getElementById("game").value;
  const pick = document.getElementById("pick").value;
  const confidence = document.getElementById("confidence").value;

  const units = getUnits(confidence);
  const amount = units * getUnitSize();

  bets.unshift({
    id: Date.now(),
    game,
    pick,
    confidence,
    units,
    amount,
    result: "pending"
  });

  render();
}

function settle(id, result) {
  const bankrollInput = document.getElementById("bankroll");
  let bankroll = Number(bankrollInput.value);

  bets = bets.map(b => {
    if (b.id === id && b.result === "pending") {
      bankroll += result === "win" ? b.amount : -b.amount;
      return { ...b, result };
    }
    return b;
  });

  bankrollInput.value = bankroll;
  render();
}

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  let wins = 0;
  let losses = 0;

  bets.forEach(b => {
    if (b.result === "win") wins++;
    if (b.result === "loss") losses++;

    container.innerHTML += `
      <div class="card">
        <strong>${b.game}</strong><br/>
        ${b.pick}<br/>
        ${b.confidence}⭐ | ${b.units}u | $${b.amount.toFixed(2)}<br/>
        Status: ${b.result}<br/>
        ${
          b.result === "pending"
            ? `<button onclick="settle(${b.id}, 'win')">Win</button>
               <button onclick="settle(${b.id}, 'loss')">Loss</button>`
            : ""
        }
      </div>
    `;
  });

  const bankroll = Number(document.getElementById("bankroll").value);
  const profit = bankroll - startingBankroll;
  const total = wins + losses;
  const winrate = total ? ((wins / total) * 100).toFixed(1) : 0;

  document.getElementById("unitSize").innerText = getUnitSize().toFixed(2);
  document.getElementById("profit").innerText = profit.toFixed(2);
  document.getElementById("winrate").innerText = winrate;
}
</script>

</body>
</html>
